<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超激踊りネコちゃん</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ディスコ背景 */
    .disco {
      animation: disco 0.15s infinite;
    }

    @keyframes disco {
      0% { background-color: #ff0055; }
      25% { background-color: #00e5ff; }
      50% { background-color: #ffea00; }
      75% { background-color: #76ff03; }
      100% { background-color: #d500f9; }
    }

    .cat-container {
      font-size: 120px;
      cursor: pointer;
      display: inline-block;
      transform-origin: center bottom;
      transition: transform 0.05s;
    }

    /* 激しいダンスのアニメーション */
    .dancing {
      animation: superDance var(--speed, 0.15s) infinite alternate ease-in-out;
    }

      0% {
        transform: translate(-40px, -30px) rotate(-40deg) scale(1.3);
        filter: drop-shadow(0 0 25px cyan);
      }

        transform: translate(40px, 20px) rotate(50deg) scale(0.7, 1.4);
        filter: drop-shadow(0 0 25px magenta);
